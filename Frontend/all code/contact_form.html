<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRESPRINT Plc - Contact Us</title>
    <link rel="stylesheet" href="contact_form.css">
</head>
<body>
     <header class="header">
    <div class="header__logo">
        <img src="./Images/headerlogo.png" alt="PRESPRINT PLC Logo">
        <span>PRESPRINT PLC</span>
    </div>
      <nav class="header__nav">
         <a href="index.html">Home</a>
         <a href="services.html">Services</a>
         <a href="gallery.html">Gallery</a>
         <a href="news.html">News</a>
         <a href="about-page.html">About Us</a>
         <a href="contact.html">Contact Us</a>
      </nav>
        <div class="header__actions">
          <button class="header__menu-btn" aria-label="Toggle menu">☰</button>
        </div>
      </header>
    <section class="form-section">
        <form action="#" method="post" class="contactform">
          <h2>Get In Touch</h2>
        <p>We'd love to hear from you!</p>

            <label>Full Name</label>
            <input type="text"
            placeholder="Enter full name" required>
            <label>Email Address</label>
            <input type="email"
            placeholder="Enter your email" required>
            <label>Phone Number</label>
            <input type="tel"  
            placeholder="Enter Phone number" required>
            <label>Your Message</label>
            <textarea rows="6"
            placeholder="Type your message here...." required></textarea>
            <button type="submit">Submit</button>
        </form>
        <div class="message" style="display: none;">
          <h2>Thank you for submitting your message!</h2>
          <button onclick="window.location.href='contact.html'">Go Back</button>
        </div>
    </section>
    <script src="contact_form.js"></script>
</body>
</html>
