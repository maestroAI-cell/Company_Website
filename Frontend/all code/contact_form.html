<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="contact_form.css">
</head>
<body>
    <header class="header">
        <div class="header__logo">
          <svg
            class="header__logo-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 100 50"
            width="200"
            height="100"
          >
            <!-- Infinity Symbol Path -->
            <path
              d="M10,25 
              C10,5 40,5 50,25 
              C60,45 90,45 90,25 
              C90,5 60,5 50,25 
              C40,45 10,45 10,25 Z"
              fill="none"
              stroke="white"
              stroke-width="4"
            />
          </svg>
          <span>PRESPRINT PLC</span>
        </div>
  
        <nav class="header__nav">
            <a href="/">Home</a>
          <a href="services.html">Services</a>
          <a href="team.html">Our Team</a>
          <a href="news.html">News</a>
          <a href="about-page.html">About Us</a>
             <!-- <a href="contact.html">Contact Us</a> -->
        </nav>
  
        <div class="header__actions">
          <button class="header__menu-btn" aria-label="Toggle menu">☰</button>
        </div>
      </header>
    <section class="form-section">
        <form action="#" method="post" class="contactform">
          <h2>Get In Touch</h2>
        <p>We'd love to hear from you!</p>

            <label>Full Name</label>
            <input type="text"
            placeholder="Enter full name" required>
            <label>Email Address</label>
            <input type="email"
            placeholder="Enter your email" required>
            <label>Phone Number</label>
            <input type="tel" id="Phone" 
            placeholder="Enter Phone number" required>
            <label>Your Message</label>
            <textarea rows="6"
            placeholder="Type your message here...." required></textarea>
            <button type="submit">Submit</button>
        </form>
        <div class="message" style="display: none;">
          <h2>Thank you for submitting your message!</h2>
          <button onclick="window.location.href='contact.html'">Go Back</button>
        </div>
    </section>
    <script src="contact_form.js"></script>
</body>
</html>
